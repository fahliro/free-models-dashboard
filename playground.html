<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Models Playground</title>
    <style>
        :root {
            --bg: #0a0a0d;
            --card: #15151c;
            --card-border: #22222a;
            --text: #e0e0e0;
            --text-muted: #888899;
            --accent: #00d1ff;
            --accent2: #a855f7;
            --green: #22c55e;
            --amber: #f59e0b;
            --red: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a24 100%);
            border: 1px solid var(--card-border);
            border-radius: 12px;
        }
        header h1 { color: var(--accent); margin-bottom: 8px; }
        header p { color: var(--text-muted); font-size: 14px; }
        a { color: var(--accent); text-decoration: none; }
        .card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        label { color: var(--text-muted); font-size: 13px; display: block; margin-bottom: 6px; }
        select, input, textarea, button {
            background: #0d0d12;
            border: 1px solid var(--card-border);
            color: var(--text);
            padding: 10px 14px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            width: 100%;
            margin-bottom: 12px;
        }
        button {
            background: var(--accent);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        button:hover { background: #33dfff; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .row { display: flex; gap: 12px; }
        .row > * { flex: 1; }
        .meta { color: var(--text-muted); font-size: 12px; margin-top: 6px; }
        .response {
            background: #0a0a0d;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px;
            min-height: 120px;
            white-space: pre-wrap;
            font-size: 13px;
            line-height: 1.6;
        }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            margin-left: 8px;
        }
        .badge-or { background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
        .badge-kg { background: rgba(168,90,247,0.15); color: var(--accent2); border: 1px solid rgba(168,90,247,0.3); }
        .error { color: var(--red); }
        .success { color: var(--green); }
    </style>
</head>
<body>
    <header>
        <h1>🧪 Free Models Playground</h1>
        <p>Test free models directly — Kilo works without API key, OpenRouter needs key</p>
        <p class="meta"><a href="https://fahliro.github.io/free-models-dashboard/">← Back to Dashboard</a></p>
    </header>

    <div class="card">
        <label>Model</label>
        <select id="model-select">
            <option value="">-- select model --</option>
        </select>

        <label>OpenRouter API Key <span style="color:var(--amber)">(only for OpenRouter models)</span></label>
        <input type="password" id="or-key" placeholder="sk-or-...">

        <label>Message</label>
        <textarea id="message" rows="3" placeholder="Type a test message...">Say hi in 5 words or less.</</textarea>

        <button id="send-btn" onclick="send()">Send Test Request</button>
        <button id="copy-btn" onclick="copyResponse()" style="background:var(--card);color:var(--text);border:1px solid var(--card-border);">Copy Response</button>

        <div class="meta" id="status"></div>
    </div>

    <div class="card">
        <label>Response</label>
        <div class="response" id="response">Response will appear here...</div>
    </div>

    <script>
        const OR_API = 'https://openrouter.ai/api/v1/chat/completions';
        const KG_API = 'https://api.kilo.ai/api/gateway/v1/chat/completions';
        const MODELS_API = 'https://cors-proxy.fadlicode-mail.workers.dev/kilo/models';

        let models = [];
        let selectedModel = null;

        async function loadModels() {
            try {
                const [orRes, kgRes] = await Promise.all([
                    fetch('https://openrouter.ai/api/v1/models').then(r => r.json()),
                    fetch(MODELS_API).then(r => r.json())
                ]);
                const orFree = (orRes.data || []).filter(isFree);
                const kgFree = (kgRes.data || []).filter(isFree);
                models = [
                    ...orFree.map(m => ({ ...m, source: 'openrouter' })),
                    ...kgFree.map(m => ({ ...m, source: 'kilo' }))
                ];
                const sel = document.getElementById('model-select');
                sel.innerHTML = '<option value="">-- select model --</option>' +
                    models.map(m => `<option value="${m.id}" data-src="${m.source}">${m.id} [${m.source}]</option>`).join('');
            } catch (e) {
                document.getElementById('status').innerHTML = `<span class="error">Failed to load models: ${e.message}</span>`;
            }
        }

        function isFree(m) {
            const p = m.pricing || {};
            const isZero = v => v === '0' || v === 0 || v === '0.000000000000';
            return isZero(p.prompt) && isZero(p.completion);
        }

        document.getElementById('model-select').addEventListener('change', e => {
            selectedModel = e.target.value;
            const src = e.target.selectedOptions[0]?.dataset.src || '';
            document.getElementById('or-key').disabled = src !== 'openrouter';
            document.getElementById('status').innerHTML = src === 'kilo'
                ? '<span class="success">Kilo model — no API key needed</span>'
                : '<span>OpenRouter model — API key required</span>';
        });

        async function send() {
            const model = selectedModel;
            const msg = document.getElementById('message').value.trim();
            const respEl = document.getElementById('response');
            const btn = document.getElementById('send-btn');
            const src = document.getElementById('model-select').selectedOptions[0]?.dataset.src || '';

            if (!model) { respEl.innerHTML = '<span class="error">Select a model first</span>'; return; }
            if (!msg) { respEl.innerHTML = '<span class="error">Type a message</span>'; return; }
            if (src === 'openrouter') {
                const key = document.getElementById('or-key').value.trim();
                if (!key) { respEl.innerHTML = '<span class="error">OpenRouter API key required</span>'; return; }
            }

            btn.disabled = true;
            respEl.innerHTML = 'Loading...';
            document.getElementById('status').innerHTML = 'Sending...';

            try {
                let url, headers, body;
                if (src === 'kilo') {
                    url = KG_API;
                    headers = { 'Content-Type': 'application/json' };
                    body = JSON.stringify({ model, messages: [{ role: 'user', content: msg }] });
                } else {
                    url = OR_API;
                    headers = {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${document.getElementById('or-key').value.trim()}`
                    };
                    body = JSON.stringify({ model, messages: [{ role: 'user', content: msg }] });
                }

                const res = await fetch(url, { method: 'POST', headers, body });
                const data = await res.json();

                if (data.error) {
                    respEl.innerHTML = `<span class="error">Error: ${data.error.message || JSON.stringify(data.error)}</span>`;
                    document.getElementById('status').innerHTML = `HTTP ${res.status}`;
                } else {
                    const text = data.choices?.[0]?.message?.content || JSON.stringify(data, null, 2);
                    const usage = data.usage || {};
                    respEl.innerHTML = `<span class="success">${text}</span>\n\n<div class="meta">Model: ${data.model || model} | Tokens: ${usage.total_tokens || 'N/A'} | Cost: ${usage.cost || 0}</div>`;
                    document.getElementById('status').innerHTML = `<span class="success">Success</span> | HTTP ${res.status}`;
                }
            } catch (e) {
                respEl.innerHTML = `<span class="error">Network error: ${e.message}</span>`;
                document.getElementById('status').innerHTML = 'Failed';
            } finally {
                btn.disabled = false;
            }
        }

        function copyResponse() {
            const text = document.getElementById('response').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copy-btn');
                const orig = btn.innerText;
                btn.innerText = 'Copied!';
                setTimeout(() => btn.innerText = orig, 1000);
            });
        }

        loadModels();
    </script>
</body>
</html>
